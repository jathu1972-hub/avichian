# Railway — AVICHIAN monorepo (service root = repository root)

[build]
builder = "NIXPACKS"
# install phase already runs npm ci via nixpacks.toml — do not run npm ci again
buildCommand = "npm run build -w @avichian/shared && npx prisma generate --schema=backend/prisma/schema.prisma && npm run build -w @avichian/backend"

[deploy]
startCommand = "cd backend && (npx prisma migrate deploy || npx prisma db push) && node dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
