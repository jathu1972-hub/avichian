# Railway — AVICHIAN student SPA (service: avichian-student)

[build]
builder = "NIXPACKS"
buildCommand = "npm run build -w @avichian/shared && npm run build -w @avichian/student-app"

[deploy]
startCommand = "npx --yes serve -s student-app/dist -l tcp://0.0.0.0:$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
