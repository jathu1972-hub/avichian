<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark only" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AVICHIAN</title>
    <!--
      Boot splash: visible on FIRST paint (before React/CSS bundle).
      Same branding as SplashScreen.tsx — replaced when React mounts.
      No artificial delay; disappears when the app is ready.
    -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        min-height: 100dvh;
        background: #09090b;
        color: #fafafa;
        color-scheme: dark only;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      }
      #root {
        min-height: 100dvh;
      }
      #avichian-boot-splash {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        width: 100%;
        padding: 1.5rem;
        background: #09090b;
        text-align: center;
      }
      #avichian-boot-splash .boot-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1.35rem;
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #fff;
        background: linear-gradient(135deg, #059669 0%, #0c4a6e 55%, #06b6d4 100%);
        box-shadow: 0 10px 28px rgba(5, 150, 105, 0.28);
      }
      #avichian-boot-splash .boot-title {
        margin: 1.5rem 0 0;
        font-size: 1.65rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #fafafa;
      }
      #avichian-boot-splash .boot-credit-label {
        margin: 2rem 0 0;
        font-size: 0.6875rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: #71717a;
      }
      #avichian-boot-splash .boot-credit-name {
        margin: 0.25rem 0 0;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #d4d4d8;
      }
      #avichian-boot-splash .boot-spinner {
        margin-top: 2.5rem;
        width: 2rem;
        height: 2rem;
        border-radius: 9999px;
        border: 3px solid rgba(5, 150, 105, 0.2);
        border-top-color: #059669;
        animation: avichian-spin 0.7s linear infinite;
      }
      @keyframes avichian-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #avichian-boot-splash .boot-spinner {
          animation: none;
          opacity: 0.5;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Instant startup splash (replaced by React when the app mounts) -->
      <div id="avichian-boot-splash" role="status" aria-live="polite" aria-label="AVICHIAN is loading">
        <div class="boot-logo" aria-hidden="true">A</div>
        <p class="boot-title">AVICHIAN</p>
        <p class="boot-credit-label">Designed &amp; Developed by</p>
        <p class="boot-credit-name">Jathurshan</p>
        <div class="boot-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
