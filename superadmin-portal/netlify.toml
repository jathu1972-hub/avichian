# Super Admin Portal — Netlify static SPA
#
# Netlify UI:
#   Base directory: monorepo root (recommended)
#   Publish directory: superadmin-portal/dist
#
# Environment:
#   VITE_API_URL = https://YOUR-API.onrender.com
#
# Backend CORS must include this site origin (FRONTEND_URLS).

[build]
  command = "npm ci && npm run build -w @avichian/shared && npm run build -w @avichian/super-admin-portal"
  publish = "superadmin-portal/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
