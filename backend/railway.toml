# Railway — AVICHIAN Backend (deploy from monorepo root OR backend/)
# After first deploy: add PostgreSQL plugin, set FRONTEND_URLS + PUBLIC_API_URL.
# Restart policy: Railway restarts crashed services automatically.

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build -w @avichian/shared && npx prisma generate && npm run build -w @avichian/backend"

[deploy]
startCommand = "cd backend && npx prisma migrate deploy || npx prisma db push; node dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
