# Railway — AVICHIAN Backend
# Project → New → Deploy from GitHub → avichian-backend
# Add PostgreSQL plugin; copy DATABASE_URL automatically.
# Custom domain: api.avichian.com

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build -w @avichian/shared && npx prisma generate && npm run build"

[deploy]
startCommand = "npx prisma migrate deploy || npx prisma db push; npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
